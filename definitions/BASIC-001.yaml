# BASIC-001 - DER Identification (DER client only, format 1.2, v1 subset)
# Source: SunSpec CSIP Conformance Test Procedures v1.3, section 7, pp. 69-70.
# Paraphrased; section/step citations only (CLAUDE.md section 9).

format_version: "1.2"
id: BASIC-001
title: "DER Identification"
status: draft

sunspec_ref:
  document: "SunSpec CSIP Conformance Test Procedures"
  version: "1.3"
  section: "7"
  pages: "69-70"
  errata: []
  profile_table:
    der_client: true
    aggregator_client: true

applies_to:
  - der_client

purpose: >
  Checks that a DER client, connecting with its own TLS device certificate,
  discovers the EndDevice entry the server pre-registered for it, checks the
  SFDI/LFDI and the registration PIN it finds there against its own values,
  and then walks the FunctionSetAssignments tree linked from that entry.
  Commissioning itself is out of scope (SunSpec BASIC-001, Purpose).

# ---------------------------------------------------------------- DUT inputs
dut_inputs:
  - name: client_certificate
    type: pem_certificate
    required: true
    description: >
      The DUT's TLS device certificate (public part only, PEM). The harness
      authorizes the TLS client by it and derives the LFDI/SFDI it
      pre-registers from it.
    example: "-----BEGIN CERTIFICATE-----\nMIIB...\n-----END CERTIFICATE-----"
  - name: lfdi
    type: lfdi
    required: true
    description: "LFDI of the DUT (40 hex digits); must equal lfdi_of(client_certificate)."
    derive_check: lfdi_matches_certificate
    derive_from: client_certificate
    example: "3E4F45AB31EDFE5B67E343E5E4562E31984E23E5"
  - name: pin
    type: pin
    required: true
    description: >
      Registration PIN configured on the DUT (6 digits, last digit is a check
      digit). The harness serves it in the DUT's Registration resource.
      No default; 111115 (the SunSpec section 3.2.3/3.2.5 assumption) is only
      an example.
    example: "111115"

# ------------------------------------------------------------- preconditions
preconditions:
  server:
    dcap_path: /dcap
    tls:
      version: "1.2"
      cipher_suites:
        - TLS_ECDHE_ECDSA_WITH_AES_128_CCM_8
      curve: secp256r1
      client_auth: required
      server_chain: serca_mica_device
    authorized_clients:
      - "${dut.lfdi}"

  resources:
    # --- Setup 1: DeviceCapability with EndDeviceListLink
    - key: dcap
      type: DeviceCapability
      href: /dcap
      poll_rate_s: 900
      links:
        EndDeviceListLink: edev_list
      description: "Setup 1 - DeviceCapability linking to the EndDeviceList."

    # --- Setup 3: at least two pre-registered EndDevices, one being the DUT
    - key: edev_list
      type: EndDeviceList
      href: /edev
      poll_rate_s: 900
      items:
        - edev_other
        - edev_dut
      description: "Setup 3 - EndDeviceList with the DUT's EndDevice and one other device."

    - key: edev_dut
      type: EndDevice
      href: /edev/1
      fields:
        sFDI: "${sfdi_of(dut.lfdi)}"
        lFDI: "${dut.lfdi}"
        changedTime: 1700000000
        enabled: true
      links:
        RegistrationLink: reg_dut
        FunctionSetAssignmentsListLink: fsa_list_dut
      description: "Setup 3 - the DUT's pre-registered EndDevice (SFDI/LFDI derived from its certificate)."

    - key: reg_dut
      type: Registration
      href: /edev/1/rg
      fields:
        dateTimeRegistered: "${run.provisioned_at}"
        pIN: "${dut.pin}"
      description: "Setup 3 - Registration carrying the DUT's PIN."

    - key: edev_other
      type: EndDevice
      href: /edev/2
      fields:
        sFDI: 27128473169
        lFDI: "0A1B2C3D4E5F60718293A4B5C6D7E8F901234567"
        changedTime: 1700000100
        enabled: true
      links:
        RegistrationLink: reg_other
        FunctionSetAssignmentsListLink: fsa_list_other
      description: >
        Setup 3 - a second, unrelated EndDevice. sFDI is sfdi_of of its lFDI
        (36-bit value 2712847316 plus check digit 9). Its changedTime is newer
        than the DUT's entry.

    - key: reg_other
      type: Registration
      href: /edev/2/rg
      fields:
        dateTimeRegistered: "${run.provisioned_at}"
        pIN: 123455
      description: "Registration of the other device (PIN 123455, valid check digit)."

    - key: fsa_list_other
      type: FunctionSetAssignmentsList
      href: /edev/2/fsa
      poll_rate_s: 300
      items: []
      description: "Empty FSA list of the other device; the DUT must not follow it (criterion C11)."

    # --- Setup 3: FSA with DERProgram and its subordinate resources (DUT only)
    - key: fsa_list_dut
      type: FunctionSetAssignmentsList
      href: /edev/1/fsa
      poll_rate_s: 300
      items:
        - fsa_1
      description: "Setup 3 - the DUT's FunctionSetAssignmentsList."

    - key: fsa_1
      type: FunctionSetAssignments
      href: /fsa/1
      fields:
        mRID: "0FB70000000000000000000000000101"
        description: "BASIC-001 FSA"
      links:
        DERProgramListLink: derp_list
        TimeLink: tm
      description: >
        Setup 3 - FSA carrying the DERProgramList. A TimeLink is included
        because a DER program is time-responsive.

    - key: tm
      type: Time
      href: /tm
      fields:
        tzOffset: 0
        dstOffset: 0
        dstStartTime: 0
        dstEndTime: 0
      description: "Time resource; currentTime and quality (7) are filled by harness defaults at response time."

    - key: derp_list
      type: DERProgramList
      href: /derp
      poll_rate_s: 300
      items:
        - derp_1
      description: "Setup 3 - DERProgramList of the FSA."

    - key: derp_1
      type: DERProgram
      href: /derp/1
      fields:
        mRID: "0FB70000000000000000000000000201"
        description: "BASIC-001 program"
        primacy: 89
      links:
        DefaultDERControlLink: dderc_1
        DERControlListLink: derc_list_1
        DERCurveListLink: dc_list_1
      description: "Setup 3 - DERProgram with its subordinate resources."

    - key: dderc_1
      type: DefaultDERControl
      href: /derp/1/dderc
      fields:
        mRID: "0FB70000000000000000000000000301"
        description: "BASIC-001 default control"
        DERControlBase:
          opModEnergize: true
      description: "Default control of the program (energize)."

    - key: derc_list_1
      type: DERControlList
      href: /derp/1/derc
      items: []
      description: "Empty DERControlList (BASIC-001 schedules no events)."

    - key: dc_list_1
      type: DERCurveList
      href: /derp/1/dc
      items: []
      description: "Empty DERCurveList."

# --------------------------------------------------------------------- steps
steps:
  - id: S1
    sunspec_step: "Procedure 1"
    role: recorder
    sunspec_tag: "[T]"
    description: "Record all client/server exchanges and TLS metadata for the run."
    records:
      - exchanges
      - request_bodies
      - response_bodies
      - tls_metadata
      - client_certificate_chain

  - id: S2
    sunspec_step: "Procedure 2"
    role: dut
    sunspec_tag: "[C]"
    description: >
      Over HTTPS, the DUT reads DeviceCapability at the configured path and
      locates the EndDeviceListLink.
    expect:
      - method: GET
        resource: dcap
        response:
          status: 200
          body: dcap
    records:
      - exchanges
      - tls_metadata
    timeout_s: 900

  - id: S3
    sunspec_step: "Procedure 3"
    role: dut
    sunspec_tag: "[C]"
    description: >
      The DUT reads the EndDeviceList found via the DeviceCapability link
      (paging with s/l as needed) and identifies the entry whose SFDI/LFDI
      matches its own identity.
    expect:
      - method: GET
        resource: edev_list
        response:
          status: 200
          body: edev_list
    timeout_s: 600

  - id: S4
    sunspec_step: "Procedure 4"
    role: dut
    sunspec_tag: "[C]"
    description: >
      Internal to the DUT - it compares the SFDI and LFDI of its EndDevice
      entry with the values it computes from its own certificate. No network
      exchange is expected; the outcome is judged by the operator (S8).
    expect: []

  - id: S5
    sunspec_step: "Procedure 5"
    role: dut
    sunspec_tag: "[C]"
    description: >
      The DUT follows the RegistrationLink of its own EndDevice entry, reads
      the Registration and compares the PIN with its own.
    after:
      - S4
    expect:
      - method: GET
        resource: reg_dut
        response:
          status: 200
          body: reg_dut
    timeout_s: 600

  - id: S7
    sunspec_step: "Procedure 7"
    role: dut
    sunspec_tag: "[C]"
    description: >
      The DUT follows the FunctionSetAssignmentsListLink of its own EndDevice
      entry and then the subordinate resources - it must GET the
      DERProgramList, DefaultDERControl, DERControlList and DERCurveList.
      List members (FunctionSetAssignments, DERProgram) may be read from the
      list bodies; reading the Time resource is allowed but not required.
    after:
      - S4
    expect:
      - method: GET
        resource: fsa_list_dut
        response:
          status: 200
          body: fsa_list_dut
      - method: GET
        resource: derp_list
        response:
          status: 200
          body: derp_list
      - method: GET
        resource: dderc_1
        response:
          status: 200
          body: dderc_1
      - method: GET
        resource: derc_list_1
        response:
          status: 200
          body: derc_list_1
      - method: GET
        resource: dc_list_1
        response:
          status: 200
          body: dc_list_1
    timeout_s: 600

  - id: S8
    extension: true
    role: operator
    sunspec_tag: none
    description: >
      The operator checks the DUT's log/UI and states whether the DUT
      reported that the SFDI, LFDI and PIN served by the harness match its
      own values (realises the validation outcome of Procedures 4 and 5).
    after:
      - S5
      - S7
    prompt:
      text: "Does the DUT's log or UI show that it compared the served SFDI, LFDI and Registration PIN with its own values and found all three matching?"
      attestation: dut_identity_validated
      choices:
        - "yes"
        - "no"
    records:
      - attestation
    timeout_s: 1200

# ------------------------------------------------------------------ criteria
criteria:
  - id: BASIC-001.C1
    title: "DUT retrieved DeviceCapability"
    sunspec_criterion: "Pass/Fail bullet 1 (client part)"
    verifies_steps:
      - S2
    requirements: []
    evidence: traffic
    severity: mandatory
    check:
      type: request_count
      select:
        method: GET
        resource: dcap
        status: 200
      min: 1
    failure_message: "The DUT never issued a successful GET on /dcap."

  - id: BASIC-001.C2
    title: "DUT retrieved the EndDeviceList linked from DeviceCapability"
    sunspec_criterion: "Pass/Fail bullet 2 (client part)"
    verifies_steps:
      - S3
    requirements:
      - "2030.5:BASE.074"
    evidence: traffic
    severity: mandatory
    check:
      type: request_count
      select:
        method: GET
        resource: edev_list
        status: 200
      min: 1
    failure_message: "The DUT never issued a successful GET on the EndDeviceList (/edev)."

  - id: BASIC-001.C3
    title: "DUT retrieved its own Registration"
    sunspec_criterion: "Pass/Fail bullet 3 (client part)"
    verifies_steps:
      - S5
    requirements:
      - "2030.5:BASE.074"
    evidence: traffic
    severity: mandatory
    check:
      type: request_count
      select:
        method: GET
        resource: reg_dut
        status: 200
      min: 1
    failure_message: "The DUT never read the Registration linked from its own EndDevice (/edev/1/rg)."

  - id: BASIC-001.C4
    title: "DUT traversed its FunctionSetAssignments and subordinate resources"
    sunspec_criterion: "Pass/Fail bullet 4 (client part)"
    verifies_steps:
      - S7
    requirements: []
    evidence: traffic
    severity: mandatory
    check:
      type: all_of
      checks:
        - type: request_count
          select:
            method: GET
            resource: fsa_list_dut
            status: 200
          min: 1
        - type: request_count
          select:
            method: GET
            resource: derp_list
            status: 200
          min: 1
        - type: request_count
          select:
            method: GET
            resource: dderc_1
            status: 200
          min: 1
        - type: request_count
          select:
            method: GET
            resource: derc_list_1
            status: 200
          min: 1
        - type: request_count
          select:
            method: GET
            resource: dc_list_1
            status: 200
          min: 1
    failure_message: "The DUT did not GET every list and subordinate resource of its FSA tree (/edev/1/fsa, /derp, /derp/1/dderc, /derp/1/derc, /derp/1/dc); see report for the missing ones."
    rationale: >
      Requires a successful GET of exactly the FSA list, DERProgramList,
      DefaultDERControl, DERControlList and DERCurveList (Keyur, 2026-11-18).
      FunctionSetAssignments and DERProgram need no separate GET because
      their full representation is contained in the list bodies (NOTE-3);
      the Time resource is not required in this test.

  - id: BASIC-001.C5
    title: "Discovery order - DeviceCapability, then EndDeviceList, then Registration and FSA list"
    sunspec_criterion: "derived from Procedures 2, 3, 5 and 7"
    verifies_steps:
      - S2
      - S3
      - S5
      - S7
    requirements: []
    evidence: traffic
    severity: mandatory
    check:
      type: all_of
      checks:
        - type: request_order
          sequence:
            - method: GET
              resource: dcap
              status: 200
            - method: GET
              resource: edev_list
              status: 200
            - method: GET
              resource: reg_dut
              status: 200
        - type: request_order
          sequence:
            - method: GET
              resource: dcap
              status: 200
            - method: GET
              resource: edev_list
              status: 200
            - method: GET
              resource: fsa_list_dut
              status: 200
    failure_message: "The DUT did not discover resources by following links in the order DeviceCapability, EndDeviceList, then Registration and FunctionSetAssignmentsList."

  - id: BASIC-001.C6
    title: "Operator confirms the DUT found SFDI, LFDI and PIN matching"
    sunspec_criterion: "Pass/Fail bullet 3"
    verifies_steps:
      - S4
      - S5
      - S8
    requirements:
      - "2030.5:SEC.001"
      - "2030.5:SEC.002"
      - "2030.5:SEC.004"
      - "2030.5:SEC.005"
      - "2030.5:BASE.074"
    evidence: operator_attestation
    severity: mandatory
    check:
      type: operator_attestation
      attestation: dut_identity_validated
      expected: "yes"
    failure_message: "The operator reported that the DUT did not confirm a match of SFDI, LFDI and PIN."
    rationale: >
      The comparison happens inside the DUT and produces no traffic. The
      harness guarantees the served SFDI/LFDI are derived from the DUT's
      certificate (C7 checks the certificate actually presented); the
      operator attests the DUT's own verdict (ADR 0003, decision 3).

  - id: BASIC-001.C7
    title: "DUT presented the certificate whose LFDI was pre-registered"
    sunspec_criterion: "derived from Setup 2 and Pass/Fail bullet 3"
    verifies_steps:
      - S2
    requirements:
      - "2030.5:SEC.004"
    evidence: tls
    severity: mandatory
    check:
      type: tls_property
      client: dut
      property: client_cert_lfdi
      op: equals
      value: "${dut.lfdi}"
      quantifier: all
    failure_message: "A DUT TLS connection presented a certificate whose LFDI differs from ${dut.lfdi}."

  - id: BASIC-001.C8
    title: "Harness self-check - DUT connections used TLS 1.2 with the mandatory cipher suite"
    sunspec_criterion: "derived from Setup 2 (harness self-check)"
    verifies_steps:
      - S2
    requirements: []
    evidence: harness_self_check
    severity: mandatory
    check:
      type: all_of
      checks:
        - type: tls_property
          client: dut
          property: protocol_version
          op: equals
          value: "1.2"
        - type: tls_property
          client: dut
          property: cipher_suite
          op: equals
          value: TLS_ECDHE_ECDSA_WITH_AES_128_CCM_8
    failure_message: "Harness bug - a DUT TLS connection was established with something other than TLS 1.2 and TLS_ECDHE_ECDSA_WITH_AES_128_CCM_8."
    rationale: >
      The harness offers only TLS 1.2 with CCM_8, so a completed handshake
      cannot violate this through DUT behaviour; a failure means the harness
      is misconfigured (ERROR). TLS conformance of the DUT is judged in COMM
      tests (NOTE-14).

  - id: BASIC-001.C9
    title: "DUT declared application/sep+xml in the Accept header"
    sunspec_criterion: "derived from section 3.2.2 general requirements"
    verifies_steps:
      - S2
      - S3
      - S5
      - S7
    requirements: []
    evidence: traffic
    severity: recommended
    check:
      type: request_header
      select:
        method: GET
      header: Accept
      op: contains
      value: application/sep+xml
      quantifier: all
    failure_message: "At least one DUT request did not list application/sep+xml in its Accept header (WARN only; strict HTTP checks belong to CORE tests)."

  - id: BASIC-001.C10
    title: "Harness self-check - every successful response was XSD-valid"
    sunspec_criterion: "Pass/Fail bullets 1, 2 and 4 (server part, harness self-check)"
    verifies_steps:
      - S2
      - S3
      - S5
      - S7
    requirements: []
    evidence: harness_self_check
    severity: mandatory
    check:
      type: xsd_valid
      select:
        client: any
        method: GET
        status: 200
      source: response_body
      allow_empty: true
    failure_message: "Harness bug - a 200 response body did not validate against sep.xsd."

  - id: BASIC-001.C11
    title: "DUT did not follow the links of another device's EndDevice"
    sunspec_criterion: "derived from Procedure 3"
    verifies_steps:
      - S3
      - S5
      - S7
    requirements: []
    evidence: traffic
    severity: mandatory
    check:
      type: request_count
      select:
        method: GET
        path_regex: "^/edev/2/(rg|fsa)$"
      min: 0
      max: 0
    failure_message: "The DUT read the Registration or FSA list of an EndDevice that is not its own - identity matching is wrong."
    rationale: >
      A DER client that matched its own entry correctly has no reason to
      follow the other device's links; doing so is observable evidence of a
      wrong SFDI/LFDI match (NOTE-5).

# ------------------------------------------------------------------ timeouts
timeouts:
  wait_for_client_s: 1800
  run_s: 3600
  default_step_s: 600
  settle_s: 120
  attestation_s: 600

# ------------------------------------------------------------ negative cases
negative_cases:
  - id: BASIC-001.N1
    title: "Client never requests its Registration"
    fault:
      kind: omit_request
      refclient_flag: skip_registration_get
      target:
        method: GET
        resource: reg_dut
      description: >
        The client behaves normally but never issues GET on the
        RegistrationLink href of its own EndDevice (/edev/1/rg). All other
        requests, including the FSA traversal, are made.
    expected:
      run_verdict: FAIL
      failing_criteria:
        - BASIC-001.C3
        - BASIC-001.C5
      passing_criteria:
        - BASIC-001.C1
        - BASIC-001.C2
        - BASIC-001.C4
        - BASIC-001.C7
        - BASIC-001.C8
        - BASIC-001.C11

  - id: BASIC-001.N2
    title: "Client stops after DeviceCapability"
    fault:
      kind: omit_request
      refclient_flag: stop_after_dcap
      target:
        method: GET
        path_regex: "^(?!/dcap$).*$"
      description: >
        The client GETs /dcap successfully and then issues no further
        requests at all (no EndDeviceList, Registration or FSA requests);
        it keeps re-polling /dcap only.
    expected:
      run_verdict: FAIL
      failing_criteria:
        - BASIC-001.C2
        - BASIC-001.C3
        - BASIC-001.C4
        - BASIC-001.C5
      passing_criteria:
        - BASIC-001.C1
        - BASIC-001.C7
        - BASIC-001.C8
        - BASIC-001.C11

  - id: BASIC-001.N3
    title: "Client skips the FunctionSetAssignments traversal"
    fault:
      kind: omit_request
      refclient_flag: skip_fsa_traversal
      target:
        method: GET
        path_regex: "^/(edev/1/fsa|fsa/.*|derp.*|tm)$"
      description: >
        The client reads /dcap, the EndDeviceList and its own Registration,
        but never requests its FunctionSetAssignmentsList or anything
        beneath it (/edev/1/fsa, /fsa/*, /derp*, /tm).
    expected:
      run_verdict: FAIL
      failing_criteria:
        - BASIC-001.C4
        - BASIC-001.C5
      passing_criteria:
        - BASIC-001.C1
        - BASIC-001.C2
        - BASIC-001.C3
        - BASIC-001.C7
        - BASIC-001.C8
        - BASIC-001.C11

  - id: BASIC-001.N4
    title: "Client matches the wrong EndDevice entry"
    fault:
      kind: wrong_identity
      refclient_flag: use_other_enddevice
      target:
        method: GET
        resource: edev_list
      description: >
        After reading the EndDeviceList, the client selects the entry whose
        LFDI does NOT equal its own (/edev/2) and follows that entry's
        RegistrationLink and FunctionSetAssignmentsListLink (/edev/2/rg,
        /edev/2/fsa) instead of its own. Its TLS certificate is unchanged.
    expected:
      run_verdict: FAIL
      failing_criteria:
        - BASIC-001.C3
        - BASIC-001.C4
        - BASIC-001.C11
      passing_criteria:
        - BASIC-001.C1
        - BASIC-001.C2
        - BASIC-001.C7
        - BASIC-001.C8

# ------------------------------------------------------------------ excluded
excluded:
  - sunspec_item: "Procedure 6"
    reason: "Aggregator-only step (iterate the other EndDevices and validate their identities); aggregator clients are out of scope for v1 (ADR 0003, decision 1)."
  - sunspec_item: "Pass/Fail bullet 2 (aggregator part)"
    reason: "Listing of further EndDevices managed by an aggregator; out of scope for v1."
  - sunspec_item: "Pass/Fail bullets 1, 2 and 4 (server part)"
    reason: "Server-under-test behaviour (server answered 200 with conformant payloads); the harness is the server. Covered only as a harness self-check (C10), never as a DUT verdict."
  - sunspec_item: "Procedure 3 (error path)"
    reason: "The DUT raising an error and stopping when no matching EndDevice exists is not exercised; the harness always pre-registers the DUT. Harness-side mismatch variants are deferred (ADR 0003, decision 3)."
  - sunspec_item: "Setup 2 (client side)"
    reason: "Installing and authorizing the DUT's certificate on the DUT is done by the user before POST /runs; the harness side is realised by preconditions.server.tls and authorized_clients."
  - sunspec_item: "Purpose (commissioning)"
    reason: "SunSpec states commissioning is out of scope for this test."

# --------------------------------------------------------------------- notes
notes:
  - id: NOTE-1
    kind: errata
    sunspec_item: "Procedure 4, 2nd bullet"
    text: >
      The LFDI bullet calls the value "SFDI" and describes it as a 16-bit
      truncation. Interpreted as: the LFDI is the SHA-256 certificate
      fingerprint left-truncated to 160 bits, 40 hex digits (2030.5 matrix
      SEC.004/SEC.005, CLAUDE.md section 6).
    open_question: false

  - id: NOTE-2
    kind: errata
    sunspec_item: "Procedure 4, 1st bullet"
    text: >
      The SFDI bullet describes "11 decimal digits with the last one being a
      check digit", whereas SEC.002 describes 11 digits plus an appended
      check digit. Per ADR 0003 decision 4, the SFDI is a 36-bit value plus a
      check digit (1 to 12 digits), served unpadded as sfdi_of(LFDI) and
      compared as an integer.
    open_question: false

  - id: NOTE-3
    kind: interpretation
    sunspec_item: "Procedures 3, 4 and 7; Pass/Fail bullet 4"
    text: >
      The procedure works on the EndDevice instance found in the
      EndDeviceList; it does not require a separate GET of the DUT's own
      EndDevice href. Hence no criterion requires GET /edev/1, and C4 does
      not require separate GETs of list members whose full representation
      is in the list body (FunctionSetAssignments, DERProgram). C4 does
      require GETs of every list and subordinate resource (FSA list,
      DERProgramList, DefaultDERControl, DERControlList, DERCurveList).
      A DUT that issues the extra GETs is not penalised.
    open_question: false
    resolution: "Accepted by Keyur on 2026-11-18 - reading the own EndDevice from the list (no GET /edev/1) is conformant; C4 enforces exactly the five list/subordinate GETs."

  - id: NOTE-4
    kind: interpretation
    sunspec_item: "Setup 3"
    text: >
      Setup asks for at least two pre-registered EndDevices; the harness
      provisions the DUT's and one other. The other entry is given the newer
      changedTime; the harness orders the list by the sep.xsd list-ordering
      rules, whatever they yield. Default paging returns one entry per
      request, so a DUT may have to page (s/l) to find its entry - this is
      required behaviour of 2030.5 clients (matrix BASE.002) and not judged
      separately here.
    open_question: false

  - id: NOTE-5
    kind: interpretation
    sunspec_item: "Procedure 3"
    text: >
      "Find the EndDevice instance matching the client's identity" is made
      observable by C11 - a DER client that follows the other device's
      Registration or FSA list has matched the wrong entry. C11 is derived,
      not a printed pass/fail bullet.
    open_question: false

  - id: NOTE-6
    kind: interpretation
    sunspec_item: "Procedure 2"
    text: >
      The step mentions retrieving DeviceCapability "using HTTP"; section
      3.2.1 requires HTTPS for all tests. All exchanges are over TLS 1.2 with
      mutual authentication; the harness offers no plain-HTTP port.
    open_question: false

  - id: NOTE-7
    kind: scope
    sunspec_item: "Title tags [C, A, S]; Procedure 6"
    text: >
      The profile table (section 4) requires BASIC-001 for DER clients and
      aggregator clients. v1 covers DER clients only (ADR 0003 decision 1);
      the aggregator parts are listed under excluded.
    open_question: false

  - id: NOTE-8
    kind: interpretation
    text: >
      Timeouts are sized for a real gateway that polls rather than reacting
      instantly. wait_for_client_s 1800 gives the user 30 minutes to point
      the DUT at the harness and restart it. S2 allows 900 s, one
      DeviceCapability pollRate (900 s served), in case the gateway only
      connects on its poll schedule; later DUT steps allow 600 s, two FSA /
      DERProgram list poll periods (pollRate 300 s served). settle_s 120
      keeps observing for late or forbidden requests (C11). run_s 3600 covers
      the worst-case sum of the step timeouts plus the operator step
      (S8, 1200 s). attestation_s 600 is the extra grace for the operator
      answer in EVALUATING.
    open_question: false

  - id: NOTE-9
    kind: errata
    sunspec_item: "Requirements Tested table, BASIC-001 row"
    text: >
      The row lists BASE.074, SEC.001, SEC.002, SEC.004 and SEC.005.
      BASE.074 is cited as printed ("2030.5:BASE.074", ADR 0003 decision 5),
      but it does not appear in the body of the 2030.5 requirements matrix
      (it jumps from BASE.073 to CFG.001), so its meaning is unknown. It is
      provisionally attached to C2, C3 and C6 (the identification
      criteria).
    open_question: false
    resolution: "Cited in BASIC-001, CORE-008, CORE-011 but undefined in the v1.3 matrix body; re-check against v1.4 or the SunSpec workgroup."

  - id: NOTE-10
    kind: interpretation
    text: >
      Criteria cite only the five IDs printed for BASIC-001 in the v1.3
      Requirements Tested table (2030.5 BASE.074, SEC.001, SEC.002, SEC.004,
      SEC.005), and only where the matrix text supports the attachment. The
      following matrix requirements are related to what BASIC-001 checks
      but are covered by other tests and therefore NOT cited here -
      2030.5 SEC.028, SEC.032, BASE.008, DNS.040, SEC.009, SEC.020, GEN.056;
      CSIP G3, G17, P14, P21, P25. As a consequence C1, C4, C5, C9 and C11
      carry no requirement ID (rule R9 deliberately left open for Keyur's
      decision). The Accept-header criterion C9 is severity recommended per
      ADR 0003 decision 7.
    open_question: false

  - id: NOTE-11
    kind: implementation_hint
    text: >
      (a) Step completion for dut steps counts matching exchanges since
      run.start, not since the step started - a real DUT may fetch the
      Registration and FSA list before S4/S5/S7 formally start. BASIC-001
      uses no selector `window`.
      (b) The Time resource's currentTime/quality come from harness defaults
      (preconditions.clock is not in the v1 subset); reading Time is not
      required by any criterion.
    open_question: false
    resolution: "Resolved by ADR 0004 - counting from run.start is the default; tests that need counting from a step use selector window (after_step / before_step_end)."

  - id: NOTE-14
    kind: scope
    sunspec_item: "Setup 2; section 3.2.2 (SEC.009)"
    text: >
      The harness offers only TLS 1.2 with TLS_ECDHE_ECDSA_WITH_AES_128_CCM_8,
      so the negotiated version and suite cannot fail through DUT behaviour.
      C8 is therefore a harness self-check (failure = ERROR, no requirement
      IDs per R9). TLS conformance of the DUT (cipher offer, certificate
      chain validation, alerts) belongs to the COMM tests.
    open_question: false

  - id: NOTE-12
    kind: interpretation
    sunspec_item: "Section 3.2.3 and 3.2.5 (Registration PIN 111115)"
    text: >
      SunSpec assumes PIN 111115 for its test setups. Here the PIN is a
      required DUT input with no default; 111115 is only the example value
      (ADR 0003 decision 8, rule R14).
    open_question: false

  - id: NOTE-13
    kind: interpretation
    sunspec_item: "Pass/Fail bullet 3"
    text: >
      S8 is a harness extension (no SunSpec step) that collects the operator
      attestation for C6, the single mandatory attestation allowed for
      "client validated SFDI/LFDI/PIN" (ADR 0003 decision 3).
    open_question: false
